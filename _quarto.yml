author:
  - name: Jozef Rivest
    email: jrivest@umich.edu
    orcid: 0000-0002-3195-3838
    position: PhD Student
    affiliations:
      - name: University of Michigan
        department: Department of Political Science

project:
  type: default
  output-dir: _output
  render:
    - paper/paper.qmd
    - presentation/presentation.qmd
    - poster/poster.qmd

date: today
date-format: long

bibliography: references/refs.bib

execute:
  freeze: auto
  message: false
  error: false
  warning: false

format:
  pdf:
    documentclass: article
    fontsize: 12pt
    cite-method: biblatex
    biblatexoptions:
      - authordate
    geometry:
      - margin=1in
    number-sections: true
    colorlinks: true
    citecolor: Maroon
    urlcolor: Maroon
    linkcolor: Maroon
    template-partials:
      - .templates/article/biblio-config.tex
      - .templates/article/biblio.tex
      - .templates/article/title.tex
    include-in-header:
      - file: .templates/article/backmatter.tex
    filters:
      - .templates/article/backmatter.lua
      - .templates/article/refs.lua
